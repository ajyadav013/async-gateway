[bandit]
exclude = ./env

[flake8]
exclude =
    docs,
    env,
    src
max_doc_length = 79
application_import_names = async-gateway, tests

[mypy]
ignore_missing_imports = True
ignore_errors = True

[tool:pytest]
testpaths = tests
addopts = --cov=async_gateway --cov-branch
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
junit_family = legacy

[coverage:report]
# Coverage ratchet floor (R28): the value measured at this step, and it may
# only ever be raised. Every later step re-measures and raises it; a CI job
# fails any commit whose value is below the base branch.
fail_under = 0
