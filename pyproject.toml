# Declarative build + project metadata for async-gateway (PEP 517 / PEP 621).
#
# Replaces the executable `setup.py` and the `setup.cfg` tool sections. Nothing
# here is computed at build time: the previous build read `requirements.txt`
# with `open()` while packaging, so an sdist that omitted that file failed to
# install at all (H26) and the read carried no explicit `encoding=` (L16).
#
# Tool configuration lives here for every tool that reads pyproject.toml
# (pytest, mypy, coverage, bandit). flake8 does not read pyproject.toml, so its
# configuration lives in `.flake8` at the repo root.

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "async-gateway"
version = "2.7.3"
description = "Any microservice will be able to use the “async_gateway” can make an async request(HTTP/SOAP/XML/FTP/redis) with the given payload to given address"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arjunsingh Yadav", email = "arjun.yadav013@gmail.com" },
]
classifiers = [
    # Deliberate downgrade from `5 - Production/Stable` (L17): the package has
    # never been published and does not yet import from a clean install.
    # Re-examined and justified in the CHANGELOG at the release step.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    # The version classifiers track `requires-python` and the CI interpreter
    # matrix; they are metadata only — no resolver reads them (M23).
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "orjson>=3.12.0,<4",
    "aioboto3>=15.5.0,<16",
    "aiofiles>=25.1.0,<26",
    # The one deliberate exact pin: 0.6.0 is the latest release of a dormant
    # project, and R7 (Step 22) owns the keep / replace / vendor decision.
    "pyfailsafe==0.6.0",
    "aioftp>=0.28.0,<1",
    "asyncssh>=2.24.0,<3",
]

[project.optional-dependencies]
dev = [
    # The `toml` extra, not bare `bandit`: reading `[tool.bandit]` out of this
    # file needs a TOML parser, and bandit only has one via stdlib `tomllib`
    # (3.11+) or the `tomli` backport the extra pulls in. `requires-python` is
    # >=3.10, so on the 3.10 CI leg bare bandit would fail to load `-c
    # pyproject.toml` — a silently unconfigured scanner.
    "bandit[toml]",
    "flake8==7.1.0",
    "flake8-builtins==2.5.0",
    "flake8-docstrings==1.7.0",
    "flake8-import-order==0.18.2",
    "flake8-quotes==3.4.0",
    "lxml",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    # flake8-import-order 0.18.2 still imports pkg_resources, so setuptools must
    # keep providing it: setuptools 81 removed pkg_resources outright and flake8
    # cannot start at all in a clean venv without a ceiling.
    # The ceiling is 76, not the 81 that setuptools' own warning text implies,
    # because 76+ still ships pkg_resources but warns on every import of it:
    # five UserWarnings on each flake8 invocation. R27-AC2 requires `flake8 .`
    # to produce *no output*, not merely exit 0, so <81 is unachievable by
    # construction; <76 is a strict subset of it.
    "setuptools<76",
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/ajyadav013/async-gateway"

[tool.setuptools.packages.find]
include = ["async_gateway*"]
namespaces = false

# --- Tool configuration migrated out of the deleted setup.cfg ---------------

[tool.bandit]
# Was `[bandit] exclude = ./env` in setup.cfg. bandit never auto-discovered
# that section (it only reads `.bandit` files or an explicit `-c`), so this
# must be passed as `bandit -c pyproject.toml` to take effect.
exclude_dirs = ["./env"]

[tool.mypy]
ignore_missing_imports = true
# Removing this is R27's job (Step 24); it currently hides ~44 errors.
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=async_gateway --cov-branch"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
junit_family = "legacy"

[tool.coverage.report]
# Coverage ratchet floor (R28): the value measured at this step, and it may
# only ever be raised. Every later step re-measures and raises it; a CI job
# fails any commit whose value is below the base branch.
#
# Measured at Step 5 (`coverage report --precision=6`): 72.900763%, after the
# third review-fix iteration moved redaction into `unwrap_cause` itself -- the
# seam at which foreign exception text becomes a caller-visible string -- and
# added the transport-error leak guards that cover it (72.657253% before;
# 72.551546% and 71.936759% before the two earlier iterations). The floor is
# truncated to two decimals rather than rounded, because rounding up would put
# it above the value it was measured from and fail the run that set it.
fail_under = 72.90
