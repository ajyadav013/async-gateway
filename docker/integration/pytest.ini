# Standalone config for the integration suite.
#
# Separate from the project's `pyproject.toml` on purpose: that one sets
# `--cov=asyncio_gateway` with `fail_under = 100`, and this suite is a
# handful of end-to-end calls that would never reach 100% of the package.
# Coverage is the unit suite's job; this one's job is "does it work
# against a real server".
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
addopts = -ra
